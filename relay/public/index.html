<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Movemote</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; background: #0e0e10; color: #e8e8ea; font: 15px system-ui, sans-serif; overflow: hidden; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #status { padding: 8px 12px; text-align: center; font-size: 12px; color: #8a8a90; }
  #status.live { color: #7ee29a; }
  #status.err { color: #ff9a9a; }

  #login { margin: auto; width: 300px; max-width: 86vw; display: flex; flex-direction: column; gap: 12px; padding: 24px; }
  #login h1 { font-size: 20px; letter-spacing: 1px; text-align: center; margin: 0 0 8px; }
  #login input { font: inherit; padding: 14px; border-radius: 10px; border: 1px solid #2a2a31; background: #16161a; color: #fff; text-align: center; }
  #login button { font: inherit; padding: 14px; border-radius: 10px; border: 0; background: #2563eb; color: #fff; }

  #session { display: none; flex: 1; flex-direction: column; }
  #pad { flex: 1; margin: 10px; border-radius: 14px;
    background: repeating-linear-gradient(45deg,#17171b,#17171b 12px,#191920 12px,#191920 24px);
    border: 1px solid #26262c; touch-action: none; position: relative; }
  #pad .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #55555c; pointer-events: none; }
  #buttons { display: flex; gap: 10px; padding: 0 10px 12px; }
  #buttons button { flex: 1; padding: 16px; font: inherit; border: 0; border-radius: 12px; background: #1d1d22; color: #e8e8ea; }
  #buttons button:active { background: #2a2a31; }
</style>
</head>
<body>
<div id="wrap">
  <div id="status">enter the PC's ID and password</div>

  <div id="login">
    <h1>MOVEMOTE</h1>
    <input id="id" inputmode="numeric" placeholder="PC ID (e.g. 123 456 789)" autocomplete="off" />
    <input id="pw" placeholder="Password" autocomplete="off" />
    <button id="connect">Connect</button>
  </div>

  <div id="session">
    <div id="pad"><div class="hint">drag to move · tap to click · two fingers to scroll</div></div>
    <div id="buttons">
      <button id="left">Left click</button>
      <button id="right">Right click</button>
    </div>
  </div>
</div>

<script>
  const statusEl = document.getElementById('status');
  const login = document.getElementById('login');
  const session = document.getElementById('session');
  const pad = document.getElementById('pad');
  const SPEED = 1.6;
  let ws = null;

  function setStatus(text, cls='') { statusEl.textContent = text; statusEl.className = cls; }
  function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
  function cmd(c) { send({ t: 'cmd', cmd: c }); }

  function wsUrl() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    return `${proto}://${location.host}/ws?role=controller`;
  }

  document.getElementById('connect').onclick = () => {
    const id = document.getElementById('id').value.replace(/\D/g, '');
    const password = document.getElementById('pw').value.trim();
    if (!id || !password) { setStatus('ID and password required', 'err'); return; }

    setStatus('connecting…');
    ws = new WebSocket(wsUrl());
    ws.onopen = () => send({ t: 'join', id, password, name: navigator.platform || 'controller' });
    ws.onclose = () => setStatus('disconnected', 'err');
    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.t === 'nohost') setStatus('that PC is not online', 'err');
      else if (m.t === 'denied') setStatus('wrong password', 'err');
      else if (m.t === 'hostgone') { setStatus('the PC went offline', 'err'); showLogin(); }
      else if (m.t === 'joined') { setStatus('● connected — controlling', 'live'); showSession(); }
      // m.t === 'msg' (pos sync) available via m.msg if you want to mirror
    };
  };

  function showSession() { login.style.display = 'none'; session.style.display = 'flex'; }
  function showLogin() { session.style.display = 'none'; login.style.display = 'flex'; }

  // ---- trackpad ----
  let last = null, moved = false, startT = 0, lastScroll = null;
  pad.addEventListener('pointerdown', (e) => { pad.setPointerCapture(e.pointerId); last = { x: e.clientX, y: e.clientY }; moved = false; startT = Date.now(); });
  pad.addEventListener('pointermove', (e) => {
    if (!last) return;
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    last = { x: e.clientX, y: e.clientY };
    if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    cmd({ t: 'move', dx: dx * SPEED, dy: dy * SPEED });
  });
  pad.addEventListener('pointerup', (e) => {
    pad.releasePointerCapture(e.pointerId);
    if (!moved && Date.now() - startT < 250) cmd({ t: 'click', button: 'left' });
    last = null;
  });
  pad.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
      const y = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const x = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      if (lastScroll) cmd({ t: 'scroll', dx: Math.round((x - lastScroll.x) / 4), dy: Math.round((lastScroll.y - y) / 4) });
      lastScroll = { x, y };
    }
  }, { passive: true });
  pad.addEventListener('touchend', () => { lastScroll = null; });

  document.getElementById('left').onclick = () => cmd({ t: 'click', button: 'left' });
  document.getElementById('right').onclick = () => cmd({ t: 'click', button: 'right' });
</script>
</body>
</html>
