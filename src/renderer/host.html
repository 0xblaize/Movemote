<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Movemote</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; font: 14px/1.5 system-ui, sans-serif;
    background: #0e0e10; color: #e8e8ea;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px; gap: 16px;
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
  .muted { color: #8a8a90; }
  .card { background: #17171b; border: 1px solid #26262c; border-radius: 10px; padding: 16px; width: 100%; box-sizing: border-box; }
  img#qr { display: block; margin: 0 auto; border-radius: 8px; background: #fff; }
  code { background: #222; padding: 2px 6px; border-radius: 5px; word-break: break-all; }
  button {
    font: inherit; border: 0; border-radius: 8px; padding: 12px 16px;
    cursor: pointer; width: 100%;
  }
  .allow { background: #2563eb; color: #fff; }
  .stop { background: #3a1212; color: #ffb4b4; border: 1px solid #5a1d1d; }
  .banner { width: 100%; text-align: center; padding: 10px; border-radius: 8px; font-weight: 600; box-sizing: border-box; }
  .banner.on { background: #15381f; color: #7ee29a; border: 1px solid #1f5a31; }
  .banner.off { background: #1a1a1f; color: #7a7a80; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
</style>
</head>
<body>
  <h1>MOVEMOTE</h1>
  <div id="banner" class="banner off">No session</div>

  <div class="card">
    <img id="qr" width="240" height="240" alt="pairing QR" />
    <p class="muted" style="text-align:center;margin:12px 0 4px">Scan from your phone, or open on another computer:</p>
    <p style="text-align:center"><code id="url">…</code></p>
  </div>

  <div class="card">
    <div class="row">
      <span>Controllers connected</span>
      <strong id="count">0</strong>
    </div>
  </div>

  <button id="toggle" class="allow">Allow control</button>
  <p class="muted" style="font-size:12px;text-align:center">Control is off until you allow it. Anyone controlling moves this computer's real cursor.</p>

<script>
  let allowed = false;
  const banner = document.getElementById('banner');
  const toggle = document.getElementById('toggle');

  function render() {
    banner.className = 'banner ' + (allowed ? 'on' : 'off');
    banner.textContent = allowed ? '● SESSION ACTIVE — cursor can be controlled' : 'No session';
    toggle.textContent = allowed ? 'Stop control' : 'Allow control';
    toggle.className = allowed ? 'stop' : 'allow';
  }

  toggle.onclick = async () => {
    allowed = !allowed;
    await window.movemote.allowControl(allowed);
    render();
  };

  window.movemote.onBoot(({ url, qr }) => {
    document.getElementById('url').textContent = url;
    document.getElementById('qr').src = qr;
  });
  window.movemote.onStatus(({ clients }) => {
    document.getElementById('count').textContent = clients;
  });
  render();
</script>
</body>
</html>
